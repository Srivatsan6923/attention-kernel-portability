# Sweep one grid on A100, as a Job rather than an interactive pod: interactive
# pods are destroyed after 6 h and a full grid takes longer than that.
#
#   IMAGE=ghcr.io/<user>/akp:v1 scripts/nrp_launch.sh prefill_full 2 2
#
# Use that script, not plain `envsubst`: envsubst blanks every variable it
# knows, including the JOB_COMPLETION_INDEX that has to survive into the pod.
# The script passes an explicit variable list.
#
# NSHARDS splits the grid across pods and PAR is how many run at once. Set PAR
# to the A100 quota actually free -- the namespace is shared, so check with
#   kubectl describe resourcequota a100-limit -n <ns>
# before launching. Pods over quota just sit Pending, which is harmless but
# looks like a hang.
#
# Run the prewarm Job to completion first. It compiles every shape once into
# the shared cache; without it each of the five repeats pays Inductor autotune
# and FlashInfer JIT again, and that dominates wall time.
apiVersion: batch/v1
kind: Job
metadata:
  name: akp-prewarm-$JOBNAME
spec:
  completions: $NSHARDS
  parallelism: $PAR
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 1
  # Preemptions and node drains are not our bug; do not spend the retry
  # budget on them.
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
  activeDeadlineSeconds: 43200
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # The cluster also has A100-PCIE-40GB and MIG-1g.10gb nodes.
                  # Benchmarking one of those and calling it the anchor would
                  # invalidate every cross-device comparison.
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [NVIDIA-A100-SXM4-80GB]
      containers:
        - name: prewarm
          image: $IMAGE
          workingDir: /workspace
          command: ["sh", "-c"]
          args:
            - python -m akp.run --grid $GRID --out /data/raw --prewarm
              --require-gpu A100-SXM4-80GB
              --shard "${JOB_COMPLETION_INDEX:?not an indexed job}" --nshards $NSHARDS
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
          resources:
            # nvcc and Inductor autotune are CPU-bound; a 4-core pod triples the
            # compile bill. A100 is a named resource, not plain nvidia.com/gpu.
            limits:   {cpu: "16", memory: 64Gi, ephemeral-storage: 100Gi, nvidia.com/a100: "1"}
            requests: {cpu: "16", memory: 64Gi, ephemeral-storage: 100Gi, nvidia.com/a100: "1"}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: akp-data}}
        # /dev/shm defaults to 64 MB in a container, which torch trips over.
        - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 8Gi}}
---
# Five process-level repeats, each split into NSHARDS config shards. Each pod
# keeps every implementation for its own configs, so the interleaving that makes
# clock drift common-mode across compared implementations is preserved.
#
# Resumable: a pod that dies is rescheduled and skips rows already written.
apiVersion: batch/v1
kind: Job
metadata:
  name: akp-sweep-$JOBNAME
spec:
  completions: $COMPLETIONS
  parallelism: $PAR
  completionMode: Indexed
  # Per-index, so one genuinely broken shard cannot abort the campaign.
  backoffLimitPerIndex: 3
  maxFailedIndexes: 2
  # Preemptions and node drains are not our bug; do not spend the retry
  # budget on them.
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
  activeDeadlineSeconds: 259200
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [NVIDIA-A100-SXM4-80GB]
      containers:
        - name: sweep
          image: $IMAGE
          workingDir: /workspace
          command: ["sh", "-c"]
          args:
            - python -m akp.run --grid $GRID --out /data/raw
              --require-gpu A100-SXM4-80GB
              --index "${JOB_COMPLETION_INDEX:?not an indexed job}" --nshards $NSHARDS
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
          resources:
            limits:   {cpu: "16", memory: 64Gi, ephemeral-storage: 100Gi, nvidia.com/a100: "1"}
            requests: {cpu: "16", memory: 64Gi, ephemeral-storage: 100Gi, nvidia.com/a100: "1"}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: akp-data}}
        - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 8Gi}}
