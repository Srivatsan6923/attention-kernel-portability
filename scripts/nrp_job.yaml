# Sweep one grid as a Job. Interactive pods are removed after 6 h, and a full
# grid takes longer.
#
#   IMAGE=ghcr.io/<user>/akp:v1 scripts/nrp_launch.sh prefill_full 2 2
#
# Launch through that script, which passes envsubst an explicit variable list
# so JOB_COMPLETION_INDEX reaches the pod unexpanded.
#
# NSHARDS splits the grid across pods and PAR is how many run at once. Set PAR
# to the free A100 quota, which you can check with
#   kubectl describe resourcequota a100-limit -n <ns>
#
# The prewarm Job compiles every shape once into the shared cache, so the timed
# repeats do not each pay for Inductor autotune and FlashInfer JIT.
apiVersion: batch/v1
kind: Job
metadata:
  name: akp-prewarm-$JOBNAME
spec:
  completions: $NSHARDS
  parallelism: $PAR
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 1
  # Do not spend the retry budget on preemptions and node drains.
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
  # Includes the time spent waiting for a GPU, which can be most of it on a
  # busy cluster. 72 h, the same as the sweep.
  activeDeadlineSeconds: 259200
  template:
    spec:
      restartPolicy: Never
      # The A100 nodes are tainted nvidia.com/gpu, and the toleration is not
      # added automatically for pods that request nvidia.com/a100.
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # Pin the exact product. The cluster also has A100-PCIE-40GB
                  # and MIG slices.
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [$GPU_PRODUCT]
                  # A node that fails preflight tends to be retried on the same
                  # node. To exclude one by hostname:
                  #   - key: kubernetes.io/hostname
                  #     operator: NotIn
                  #     values: [some-bad-node.example.edu]
          # Prefer us-west, where the storage is. The GPU model also exists
          # in other regions, and the cache is small enough to read remotely.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: [us-west]
      containers:
        - name: prewarm
          image: $IMAGE
          workingDir: /workspace
          command: ["sh", "-c"]
          args:
            - python -m akp.preflight --require-gpu $REQUIRE_GPU
              --out /data/preflight/$JOBNAME-prewarm-"${JOB_COMPLETION_INDEX:?not an indexed job}".json &&
              python -m akp.run --grid $GRID --out /data/raw --prewarm
              --require-gpu $REQUIRE_GPU
              --shard "$JOB_COMPLETION_INDEX" --nshards $NSHARDS
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
          resources:
            # nvcc and Inductor autotune are CPU-bound.
            limits:   {cpu: "$CPU", memory: $MEM, ephemeral-storage: 100Gi, $GPU_RESOURCE: "1"}
            requests: {cpu: "$CPU", memory: $MEM, ephemeral-storage: 100Gi, $GPU_RESOURCE: "1"}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: akp-data}}
        # /dev/shm defaults to 64 MB in a container, which is too small for torch.
        - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 8Gi}}
---
# Five process-level repeats, each split into NSHARDS config shards. Each pod
# runs every implementation for its own configs. A pod that dies is rescheduled
# and skips rows already written.
apiVersion: batch/v1
kind: Job
metadata:
  name: akp-sweep-$JOBNAME
spec:
  completions: $COMPLETIONS
  parallelism: $PAR
  completionMode: Indexed
  # Per index, so one broken shard cannot stop the whole sweep.
  backoffLimitPerIndex: 3
  maxFailedIndexes: 2
  # Do not spend the retry budget on preemptions and node drains.
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
  activeDeadlineSeconds: 259200
  template:
    spec:
      restartPolicy: Never
      # The A100 nodes are tainted nvidia.com/gpu, and the toleration is not
      # added automatically for pods that request nvidia.com/a100.
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [$GPU_PRODUCT]
                  # A node that fails preflight tends to be retried on the same
                  # node. To exclude one by hostname:
                  #   - key: kubernetes.io/hostname
                  #     operator: NotIn
                  #     values: [some-bad-node.example.edu]
          # Prefer us-west, where the storage is. The GPU model also exists
          # in other regions, and the cache is small enough to read remotely.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: [us-west]
      containers:
        - name: sweep
          image: $IMAGE
          workingDir: /workspace
          command: ["sh", "-c"]
          args:
            # Each pod can land on a different node, so each pod runs its own
            # preflight. A node that fails it writes no rows.
            - python -m akp.preflight --require-gpu $REQUIRE_GPU
              --out /data/preflight/$JOBNAME-sweep-"${JOB_COMPLETION_INDEX:?not an indexed job}".json &&
              python -m akp.run --grid $GRID --out /data/raw
              --require-gpu $REQUIRE_GPU
              --index "$JOB_COMPLETION_INDEX" --nshards $NSHARDS
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
          resources:
            limits:   {cpu: "$CPU", memory: $MEM, ephemeral-storage: 100Gi, $GPU_RESOURCE: "1"}
            requests: {cpu: "$CPU", memory: $MEM, ephemeral-storage: 100Gi, $GPU_RESOURCE: "1"}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: akp-data}}
        - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 8Gi}}
