# Shared volume for results and compile caches. Apply once.
#
# rook-cephfs supports ReadWriteMany, which the parallel sweep pods need.
# It is in US West. See nrp.ai/documentation/userdocs/storage.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: akp-data
spec:
  storageClassName: rook-cephfs
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 50Gi
